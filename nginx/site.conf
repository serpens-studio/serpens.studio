# ---- www -> apex ----
# https is hard-coded: Traefik terminates TLS, nginx only sees http, so
# $scheme would emit an http:// Location and add a redirect hop.
server {
    listen 80;
    listen [::]:80;
    server_name ~^www\.(?<apex>.+)$;
    return 301 https://$apex$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ---- legacy URLs from the previous site ----
    # /about is covered by the trailing-slash rule below. Keep these permanently.
    location = /services      { return 301 /pricing/; }
    location = /work          { return 301 /results/econ-windows/; }
    location = /work/scoutmap { return 301 /results/econ-windows/; }
    location = /work/meridian { return 301 /results/econ-windows/; }

    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: absolute ones would leak http://<container>:80.
    absolute_redirect off;
    port_in_redirect  off;

    charset utf-8;
    server_tokens off;
    autoindex off;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/ld+json application/xml
               image/svg+xml application/rss+xml;

    # ---- security headers ----
    # Server level only: add_header in a location REPLACES the inherited set,
    # so cache policy below uses `expires` instead.
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # unsafe-inline required for inline style attrs, img onerror, ld+json.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https:; form-action 'self' https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # ---- health check (Dokploy / Docker) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- crawler files: always fresh ----
    location = /robots.txt  { expires 1h; }
    location = /sitemap.xml { expires 1h; }

    # ---- content-hashed CSS/JS: safe to cache forever ----
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # repeated: add_header here drops the server-level set
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ---- images / fonts: long cache ----
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # ---- canonical trailing slash ----
    # /pricing -> /pricing/, but only when the dir exists so typos 404 directly.
    # [^.]* keeps anything with a file extension out of this location.
    location ~ ^(?<dirpath>/[^.]*[^/])$ {
        if (-d "$document_root$dirpath") {
            return 301 $dirpath/;
        }
        expires -1;
        try_files $uri =404;
    }

    # ---- clean URLs: /pricing/ -> /pricing/index.html ----
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Index-less dirs and denied dotfiles would otherwise 403.
    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # never serve dotfiles
    location ~ /\. { deny all; }
}
